<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mannys 1×1-Lernkartei</title>
<style>
:root{--bg:#f7f4ea;--card:#fff;--ink:#24323d;--accent:#4f7f73;--soft:#dcebe5;--gold:#f2cf72;--bad:#e7a1a1}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#f8f3e7,#e8f3ef);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:24px}.head{text-align:center}.manny{font-size:72px;filter:drop-shadow(0 4px 3px #bbb)}
h1{margin:4px 0 0;font-size:clamp(28px,6vw,46px)}.sub{margin:6px 0 18px;color:#52636b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#ffffffb8;border-radius:16px;padding:10px;text-align:center}
.card{background:var(--card);border-radius:28px;padding:26px;min-height:310px;box-shadow:0 14px 40px #4563  ;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.tag{background:var(--soft);padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px}.q{font-size:clamp(38px,10vw,72px);font-weight:800;margin:26px 0 18px}
.answer{font-size:clamp(32px,8vw,58px);font-weight:800;color:var(--accent);min-height:70px}.hint{font-size:15px;color:#68777d;margin-top:6px}
button{border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer}.show{background:var(--gold);width:100%;margin-top:18px}
.actions{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.yes{background:#a8d9c4}.again{background:#f3b9b9}
.bottom{display:flex;gap:10px;margin-top:14px}.bottom button{flex:1;background:#fff}.progress{height:12px;background:#fff;border-radius:999px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:var(--accent);transition:.25s}
.note{text-align:center;font-size:14px;color:#64757b;margin-top:16px}
@media(max-width:500px){.wrap{padding:14px}.card{min-height:280px;padding:20px}.stats{font-size:14px}}
</style>
</head>

  <div class="stats">

  </div>

  </div>
  <div class="bottom">

</div>
